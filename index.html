<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Car Deck</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="main-header">
		<h1>🚗 Our Car Deck</h1>
		<p>Finding our next car</p>

		<div class="header-buttons">
			<button id="favorites-toggle">
				♡ Favorites (0)
			</button>

			<button id="compare-toggle">
				⚖ Compare (0)
			</button>
            <button id="discover-toggle">🃏 Discover</button>
		</div>
	</header>

    <!-- Main car collection -->
        <!-- Sort and filter controls -->
    <section id="car-controls">

        <div class="control-group">
            <label for="car-search">Search cars</label>
            <input type="search" id="car-search" placeholder="Search name or model (e.g. Octavia, 1.8 TSI)">
        </div>

        <div class="control-group">
            <label for="sort-select">Sort by</label>

            <select id="sort-select">
                <option value="default">Default order</option>
				<option value="score-desc">Total score: High → Low</option>
				<option value="score-asc">Total score: Low → High</option>
                <option value="price-asc">Price: Low → High</option>
                <option value="price-desc">Price: High → Low</option>
                <option value="power-asc">Power: Low → High</option>
                <option value="power-desc">Power: High → Low</option>
                <option value="fuel-asc">Fuel: Low → High</option>
                <option value="fuel-desc">Fuel: High → Low</option>
                <option value="boot-asc">Boot space: Small → Large</option>
                <option value="boot-desc">Boot space: Large → Small</option>
                <option value="sleeping-desc">Sleeping inside: Best → Worst</option>
                <option value="sleeping-asc">Sleeping inside: Worst → Best</option>
                <option value="maintenance-asc">Maintenance: Low → High</option>
                <option value="maintenance-desc">Maintenance: High → Low</option>
                <option value="year-asc">Year: Old → New</option>
                <option value="year-desc">Year: New → Old</option>
            </select>
        </div>


        <div class="control-group">
            <label>Filters</label>

            <div class="filter-row">

                <input
                    type="number"
                    id="filter-price"
                    placeholder="Max price €"
                    min="0"
                >

                <input
                    type="number"
                    id="filter-fuel"
                    placeholder="Max fuel L/100km"
                    min="0"
                    step="0.1"
                >

                <input
                    type="number"
                    id="filter-year"
                    placeholder="Minimum year"
                    min="1900"
                    max="2100"
                >

                <select id="filter-transmission">
                    <option value="all">All transmissions</option>
                    <option value="Manual">Manual</option>
                    <option value="Automatic">Automatic</option>
                </select>

                <select id="filter-drive">
                    <option value="all">All drive types</option>
                    <option value="Front-wheel drive">Front-wheel drive</option>
                    <option value="Rear-wheel drive">Rear-wheel drive</option>
                    <option value="All-wheel drive">All-wheel drive</option>
                </select>

            </div>
        </div>


        <button id="clear-filters">
            Clear filters
        </button>

    </section>


    <!-- Main car collection -->
    <main id="car-grid">
        <!-- Cars are generated by JavaScript -->
    </main>


    <!-- Detailed car view -->
    <main id="car-detail" class="hidden">

        <button id="back-button">← Back to cars</button>

        <div id="detail-content">
            <!-- Detailed car information goes here -->
        </div>

    </main>
	
    <main id="discover-page" class="hidden">
        <div class="discover-topbar">
            <button id="discover-back-button">← Back to cars</button>
            <button id="discover-shortlist-toggle">♡ Shortlist (0)</button>
        </div>
        <section id="discover-review">
            <p class="discover-kicker">OUR CAR DECK · DISCOVER</p>
            <h1>Would this car work for us?</h1>
            <p id="discover-progress" class="discover-subtitle"></p>
            <div id="discover-card"></div>
            <div class="discover-actions">
                <button id="discover-undo" disabled>↶ Undo</button>
                <button id="discover-skip">✕ Skip</button>
                <button id="discover-keep">♥ Keep</button>
            </div>
            <p class="discover-hint">Keep adds a car to your saved shortlist. Skip hides it from Discover. You can revisit your shortlist any time.</p>
        </section>
        <section id="discover-shortlist" class="hidden">
            <h1>Saved shortlist</h1>
            <p class="discover-subtitle">Cars you want to consider later.</p>
            <div id="discover-shortlist-grid"></div>
        </section>
    </main>

	<main id="compare-page" class="hidden">
		<button id="compare-back-button">
			← Back to cars
		</button>

		<div id="compare-content">
			<!-- Comparison generated by JavaScript -->
		</div>
	</main>
	
	<script src="cars.js"></script>
    <script src="script.js"></script>

</body>
</html>
